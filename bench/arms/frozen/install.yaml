# ARM: frozen
# A one-time human-authored profile, never updated. If this ties preceptor-on, the continuous loop is unjustified.
#
# This file is the ONLY thing that differs between arms. Task, model, DTU
# profile, and timeout are held fixed by the harness. If you change anything
# else here, the comparison is no longer controlled.
requires:
  env: [ANTHROPIC_API_KEY]
setup_cmds:
  # cryptography 50.0.1 SIGILLs on aarch64 during tool-mcp import (exit 132).
  # See AGENTS.md ("Known install blocker: cryptography on aarch64").
  - uv tool install -vv git+https://github.com/microsoft/amplifier --with "cryptography==45.0.7"
  - amplifier bundle add git+https://github.com/microsoft/amplifier-foundation@main --app
  - amplifier bundle add 'git+https://github.com/michaeljabbour/amplifier-bundle-preceptor@main' --app
  # Frozen ledger staged at seed time; autonomy disabled.
