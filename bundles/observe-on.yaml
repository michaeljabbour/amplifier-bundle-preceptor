bundle:
  name: preceptor-observe-on
  version: 0.1.0
  description: |
    Observation, EXPLICITLY ENABLED. Running this bundle is the consent act.

    Records structure only: tool sequence, a SHA-256 of tool input, success flags,
    run boundaries. No message text, no file contents, no free-text field. Local,
    90-day retention, readable and deletable by you. Read docs/CONSENT.md first.

includes:
  - bundle: git+https://github.com/microsoft/amplifier-foundation@main
  # The -on behavior, NOT preceptor-observer (which ships enabled: false).
  #
  # Do not add preceptor-observer here as well, and do not "override" it with a
  # root-level hooks: block. Both were tried; both silently recorded nothing.
  # When one module is declared twice in a composition the first declaration's
  # config wins entire -- proven by instrumenting mount(), which received all six
  # of the disabled behavior's keys and none of the override's. Exactly one
  # declaration of hooks-trajectory-observer per composition.
  - bundle: preceptor:behaviors/preceptor-observer-on
