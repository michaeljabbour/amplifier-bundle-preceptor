[project]
name = "amplifier-module-hooks-cue-injector"
version = "0.1.0"
description = "Doses evidence-backed cues from the preceptor ledger, with a human receipt"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.entry-points."amplifier.modules"]
hooks-cue-injector = "amplifier_module_hooks_cue_injector:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_hooks_cue_injector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = ["amplifier-core>=1.4.1", "pytest", "pytest-asyncio"]
