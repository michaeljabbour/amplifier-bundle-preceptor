[project]
name = "amplifier-module-hooks-trajectory-observer"
version = "0.1.0"
description = "Records raw structural trajectory form off the model's path"
requires-python = ">=3.11"
dependencies = []

[project.entry-points."amplifier.modules"]
hooks-trajectory-observer = "amplifier_module_hooks_trajectory_observer:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_hooks_trajectory_observer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = ["amplifier-core>=1.4.1", "pytest", "pytest-asyncio"]
