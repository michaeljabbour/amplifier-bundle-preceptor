[project]
name = "amplifier-module-tool-preceptor"
version = "0.1.0"
description = "The preceptor ledger — evidence-gated cue lifecycle with an autonomy lock"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.entry-points."amplifier.modules"]
tool-preceptor = "amplifier_module_tool_preceptor:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_tool_preceptor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
